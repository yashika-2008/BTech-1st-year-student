<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- in this we do video and audio tags -->
     <h1> hello world </h1>
     <br>
     <video controls autoplay muted loop width="500" height="300">
        <source src="./myvideo.mp4" type="video/mp4">
        Your browser does not support the video tag.
     </video>
     <br>
     <video controls autoplay muted loop width="500" height="300">
        <source src="./oceansound.mp4" type="video/mp4">
        Your browser does not support the video tag.
     </video>
     <hr>

     <!--AUDIO TAG-->
     <audio controls autoplay muted loop >
      <source src="./myaudio.mp3" type="audio/mp3">
      Your browser does support the audio tag
     </audio>
     <br>
     <audio controls autoplay muted loop>
      <source src="./audio.mp3" type="audio/mp3">
      Your browser does support the audio tag
     </audio>

     
</body>
</html>
