<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="2" cellpadding="20" cellspacing="5">
        <caption> Time Table</caption>
        <thead>
            <tr>
                <th>Day/Time</th>
                <th colspan="2">9.00-11.00</th>
                <th>Lunch</th>
                <th>12.00-2.00</th>
                <th>2.00-4.00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Monday</th>
                <td>Maths</td>
                <td>Hindi</td>
                <td rowspan="6">Lunch</td>
                <td>Science</td>
                <td>SST</td>
            </tr>
            
             <tr>
                <th>Tuesday</th>
                <td>Maths</td>
                <td>Science</td>
                <td>Hindi</td>
                <td>English</td>
            </tr>

             <tr>
                <th>Wednesday</th>
                <td>Maths</td>
                <td>Computer</td>
                <td>Science</td>
                <td>English</td>
            </tr>
            <tr>
                <th>Thursday</th>
                <td>Maths</td>
                <td>Games</td>
                <td>English</td>
                <td>SST</td>
            </tr>
            <tr>
                <th>Friday</th>
                <td>Maths</td>
                <td>Computer</td>
                <td>Games</td>
                <td>Science</td>
            </tr>
            
        </tbody>
    </table>
    
</body>
</html>
