<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGS like image , audio and video</title>
</head>
<body>
    <h1>Various types of tags</h1>
    <h2>Hello World </h2>
    <br>
    <!-- Image tag -->

     <img src=" https://wallup.net/wp-content/uploads/2016/02/18/286966-nature-photography.jpg" alt="Nature image" height="300" width="500"/>
      <br>

     <!-- Agar kisi whagah se image link load na ho toh wha alt kaam karta hai or hum link mai kuch galti karkar bhi alt wala dheka sakte hai -->

      <img src="https://wallpaperaccess.com/full/1102051.jpg 123 " alt="God image" height="300" width="500"/>

      <!-- Relative link image -->

      <img src="./god.jpg"alt="god image" height="300" width="500"/>
      <hr/>

      <!--Bold , Italic,Underline tags-->
      <b>Kashish Yadav</b>
      <br>
      <u>Yashika Yadav</u>
      <br>
      <i>Aditya Yadav</i>
      <br>
      <!--big and small tags-->
      <Big>this is my lecture 2 </Big>
      <hr/>
      <small> this is my lecture 2 </small>
      
      
</body>
</html>
